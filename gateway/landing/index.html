<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自习座位预约系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      background: #f5f7fb;
      color: #1f2937;
      padding: 40px 20px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    .header {
      padding: 34px 0 28px;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 28px;
    }
    .system-label {
      display: inline-block;
      margin-bottom: 12px;
      color: #2563eb;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .header h1 {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #111827;
    }
    .header p {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.7;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-bottom: 36px;
    }
    .card {
      min-height: 180px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .card:hover {
      border-color: #2563eb;
      box-shadow: 0 10px 24px rgba(31, 41, 55, 0.08);
      transform: translateY(-2px);
    }
    .card h3 {
      font-size: 21px;
      color: #111827;
      margin-bottom: 10px;
    }
    .card p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.7;
    }
    .card .action {
      margin-top: 22px;
      color: #2563eb;
      font-size: 14px;
      font-weight: 600;
    }
    .footer {
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      color: #9ca3af;
      font-size: 13px;
    }
    @media (max-width: 640px) {
      body { padding: 24px 16px; }
      .header { padding-top: 22px; }
      .header h1 { font-size: 28px; }
      .card { min-height: 160px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="system-label">SYSTEM ENTRY</span>
      <h1>自习座位预约系统</h1>
      <p>统一入口页。请选择对应端口进入系统功能。</p>
    </div>

    <div class="cards">
      <a href="/student/" class="card">
        <div>
          <h3>学生端</h3>
          <p>查询自习室、预约座位、签到、查看通知与个人记录。</p>
        </div>
        <span class="action">进入学生端 →</span>
      </a>

      <a href="/admin/" class="card">
        <div>
          <h3>管理后台</h3>
          <p>维护自习室、座位、用户权限、预约记录与系统配置。</p>
        </div>
        <span class="action">进入管理后台 →</span>
      </a>

      <a href="/ai/" class="card">
        <div>
          <h3>智能助手</h3>
          <p>通过对话查询空座、获取推荐，并辅助完成预约操作。</p>
        </div>
        <span class="action">进入智能助手 →</span>
      </a>
    </div>

    <div class="footer">
      © 2026 自习座位预约系统 · 软件过程管理课程项目
    </div>
  </div>
</body>
</html>
